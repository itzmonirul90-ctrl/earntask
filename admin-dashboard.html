<script type="module">


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rvwboegeisnrhwicvvhj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Kz3hgj9W0khG3JEIclhx2g_HZ6eSyQQ";


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
    text,
    type="success"
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " +
        type;


    setTimeout(
        function(){

            message.className =
                "message";

        },
        4000
    );

}



/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdmin(){


    const {
        data:{
            user
        },
        error:userError
    } =
    await supabase
        .auth
        .getUser();


    if(
        userError ||
        !user
    ){

        window.location.href =
            "login.html";

        return null;

    }



    const {
        data:profile,
        error:profileError
    } =
    await supabase

        .from("profiles")

        .select("*")

        .eq(
            "id",
            user.id
        )

        .single();



    if(profileError){

        console.error(
            profileError
        );


        alert(
            "Unable to load admin profile."
        );

        return null;

    }



    if(
        profile.role !==
        "admin"
    ){

        if(
            profile.role ===
            "worker"
        ){

            window.location.href =
                "worker-dashboard.html";

        }

        else if(
            profile.role ===
            "employer"
        ){

            window.location.href =
                "employer-dashboard.html";

        }

        else{

            window.location.href =
                "login.html";

        }


        return null;

    }



    document.getElementById(
        "adminName"
    ).textContent =

        profile.full_name ||
        profile.username ||
        "Admin";


    return user;

}



/* =========================================
   LOAD COUNTS
========================================= */

async function loadCounts(){


    /*
     * TOTAL
     */

    const {
        count:totalCount
    } =
    await supabase

        .from("jobs")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        );


    document.getElementById(
        "totalCount"
    ).textContent =

        totalCount || 0;



    /*
     * PENDING
     */

    const {
        count:pendingCount
    } =
    await supabase

        .from("jobs")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )

        .eq(
            "status",
            "pending"
        );


    document.getElementById(
        "pendingCount"
    ).textContent =

        pendingCount || 0;



    /*
     * ACTIVE
     */

    const {
        count:activeCount
    } =
    await supabase

        .from("jobs")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )

        .eq(
            "status",
            "active"
        );


    document.getElementById(
        "activeCount"
    ).textContent =

        activeCount || 0;

}



/* =========================================
   LOAD PENDING JOBS
========================================= */

async function loadPendingJobs(){


    const list =
        document.getElementById(
            "pendingJobsList"
        );


    list.innerHTML =

        `
        <div class="loading">
            Loading pending jobs...
        </div>
        `;



    const {
        data:jobs,
        error
    } =
    await supabase

        .from("jobs")

        .select("*")

        .eq(
            "status",
            "pending"
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );



    if(error){

        console.error(
            error
        );


        list.innerHTML =

            `
            <div class="error">

                Unable to load pending jobs.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
            `;

        return;

    }



    if(
        !jobs ||
        jobs.length === 0
    ){

        list.innerHTML =

            `
            <div class="empty">

                🎉

                <br><br>

                No pending jobs.

            </div>
            `;

        return;

    }



    list.innerHTML = "";



    jobs.forEach(
        function(job){

            createJobCard(
                job,
                list,
                true
            );

        }
    );

}



/* =========================================
   LOAD ALL JOBS
========================================= */

async function loadAllJobs(){


    const list =
        document.getElementById(
            "allJobsList"
        );


    list.innerHTML =

        `
        <div class="loading">
            Loading jobs...
        </div>
        `;



    const {
        data:jobs,
        error
    } =
    await supabase

        .from("jobs")

        .select("*")

        .order(
            "created_at",
            {
                ascending:false
            }
        )

        .limit(100);



    if(error){

        console.error(
            error
        );


        list.innerHTML =

            `
            <div class="error">

                Unable to load jobs.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
            `;

        return;

    }



    if(
        !jobs ||
        jobs.length === 0
    ){

        list.innerHTML =

            `
            <div class="empty">

                No jobs found.

            </div>
            `;

        return;

    }



    list.innerHTML = "";



    jobs.forEach(
        function(job){

            createJobCard(
                job,
                list,
                false
            );

        }
    );

}



/* =========================================
   CREATE JOB CARD
========================================= */

function createJobCard(
    job,
    container,
    pendingOnly
){


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "job";



    const reward =

        Number(
            job.reward ??
            job.reward_per_worker ??
            0
        );



    const workers =

        Number(
            job.workers_needed ??
            job.workers ??
            0
        );



    const status =
        job.status ||
        "pending";



    item.innerHTML =

        `

        <div class="job-info">


            <div>

                <span
                    class="badge category"
                >
                    ${escapeHtml(
                        job.category ||
                        "Other"
                    )}
                </span>


                <span
                    class="badge ${status === "pending"
                        ? "pending"
                        : ""}"
                >
                    ${escapeHtml(
                        status
                    )}
                </span>

            </div>


            <h3>

                ${escapeHtml(
                    job.title ||
                    "Untitled Job"
                )}

            </h3>


            <p>

                Subcategory:
                ${escapeHtml(
                    job.subcategory ||
                    "General"
                )}

            </p>


            <p>

                Workers Needed:
                ${workers}

            </p>


            <p>

                Deadline:
                ${escapeHtml(
                    job.deadline ||
                    "No deadline"
                )}

            </p>

        </div>



        <div>


            <div class="reward">

                $${reward.toFixed(2)}

            </div>


            <div class="actions">


                <button
                    class="view-btn"
                    onclick="viewJob('${job.id}')"
                >
                    View
                </button>


                ${
                    pendingOnly
                    ?
                    `

                    <button
                        class="approve-btn"
                        onclick="approveJob('${job.id}')"
                    >
                        ✓ Approve
                    </button>


                    <button
                        class="reject-btn"
                        onclick="rejectJob('${job.id}')"
                    >
                        ✕ Reject
                    </button>

                    `
                    :
                    ""
                }

            </div>

        </div>

        `;


    container.appendChild(
        item
    );

}



/* =========================================
   VIEW JOB
========================================= */

window.viewJob =
function(jobId){

    window.open(
        "job.html?id=" +
        encodeURIComponent(
            jobId
        ),
        "_blank"
    );

};



/* =========================================
   APPROVE JOB
========================================= */

window.approveJob =
async function(jobId){


    const confirmed =
        confirm(
            "Are you sure you want to approve this job?"
        );


    if(!confirmed){

        return;

    }



    const {
        error
    } =
    await supabase

        .from("jobs")

        .update({
            status:"active"
        })

        .eq(
            "id",
            jobId
        )

        .eq(
            "status",
            "pending"
        );



    if(error){

        console.error(
            error
        );


        showMessage(
            "Approve failed: " +
            error.message,
            "error"
        );

        return;

    }



    showMessage(
        "Job approved successfully."
    );


    await loadCounts();

    await loadPendingJobs();

    await loadAllJobs();

};



/* =========================================
   REJECT JOB
========================================= */

window.rejectJob =
async function(jobId){


    const confirmed =
        confirm(
            "Are you sure you want to reject this job?"
        );


    if(!confirmed){

        return;

    }



    const {
        error
    } =
    await supabase

        .from("jobs")

        .update({
            status:"rejected"
        })

        .eq(
            "id",
            jobId
        )

        .eq(
            "status",
            "pending"
        );



    if(error){

        console.error(
            error
        );


        showMessage(
            "Reject failed: " +
            error.message,
            "error"
        );

        return;

    }



    showMessage(
        "Job rejected successfully."
    );


    await loadCounts();

    await loadPendingJobs();

    await loadAllJobs();

};



/* =========================================
   LOGOUT
========================================= */

document
    .getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        async function(event){

            event.preventDefault();


            await supabase
                .auth
                .signOut();


            window.location.href =
                "login.html";

        }
    );



/* =========================================
   START ADMIN DASHBOARD
========================================= */

async function startDashboard(){

    const user =
        await checkAdmin();


    if(!user){

        return;

    }


    await loadCounts();

    await loadPendingJobs();

    await loadAllJobs();

}


startDashboard();


</script>

</body>
