<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Dashboard - EarnTask</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{
    font-family:Arial,sans-serif;
    background:#f8fafc;
    color:#172033;
}


/* ================================
   SIDEBAR
================================ */

.sidebar{
    position:fixed;

    left:0;
    top:0;

    width:240px;
    height:100vh;

    background:#111827;
    color:white;

    padding:25px 15px;

    overflow-y:auto;
}


.logo{
    font-size:27px;

    font-weight:800;

    text-align:center;

    margin-bottom:30px;
}


.logo span{
    color:#22c55e;
}


.sidebar a{
    display:block;

    color:#d1d5db;

    text-decoration:none;

    padding:13px 15px;

    margin-bottom:7px;

    border-radius:8px;
}


.sidebar a:hover,
.sidebar a.active{
    background:#16a34a;

    color:white;
}


.logout{
    position:absolute;

    bottom:25px;

    left:15px;
    right:15px;

    background:#dc2626 !important;

    color:white !important;

    text-align:center;
}


/* ================================
   MAIN
================================ */

.main{
    margin-left:240px;

    padding:30px;
}


.topbar{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;
}


.topbar h1{
    font-size:30px;
}


.admin-name{
    background:white;

    padding:10px 18px;

    border-radius:10px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.05);
}


/* ================================
   CARDS
================================ */

.cards{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:20px;

    margin-bottom:30px;
}


.card{
    background:white;

    padding:25px;

    border-radius:14px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.05);
}


.card-icon{
    font-size:30px;

    margin-bottom:10px;
}


.card-title{
    color:#64748b;

    font-size:14px;

    margin-bottom:8px;
}


.card-number{
    font-size:28px;

    font-weight:800;
}


/* ================================
   SECTION
================================ */

.section{
    background:white;

    padding:25px;

    border-radius:14px;

    margin-bottom:25px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.05);
}


.section h2{
    margin-bottom:20px;
}


/* ================================
   MESSAGE
================================ */

.message{
    margin-bottom:20px;

    padding:13px;

    border-radius:8px;

    display:none;

    font-weight:600;
}


.message.success{
    display:block;

    background:#dcfce7;

    color:#166534;
}


.message.error{
    display:block;

    background:#fee2e2;

    color:#991b1b;
}


/* ================================
   JOB
================================ */

.job{
    border:1px solid #e5e7eb;

    border-radius:12px;

    padding:20px;

    margin-bottom:15px;

    display:flex;

    justify-content:space-between;

    gap:20px;

    align-items:center;
}


.job-info{
    flex:1;
}


.job-info h3{
    font-size:18px;

    margin:10px 0 8px;
}


.job-info p{
    color:#64748b;

    font-size:14px;

    margin:5px 0;
}


.badge{
    display:inline-block;

    padding:5px 9px;

    border-radius:6px;

    font-size:12px;

    font-weight:700;

    margin-right:5px;
}


.pending{
    background:#fef3c7;

    color:#92400e;
}


.active{
    background:#dcfce7;

    color:#166534;
}


.rejected{
    background:#fee2e2;

    color:#991b1b;
}


.category{
    background:#eff6ff;

    color:#2563eb;
}


.reward{
    color:#16a34a;

    font-size:18px;

    font-weight:800;

    margin-bottom:10px;
}


/* ================================
   BUTTONS
================================ */

.actions{
    display:flex;

    gap:8px;

    flex-wrap:wrap;
}


button{
    border:none;

    padding:10px 15px;

    border-radius:7px;

    color:white;

    font-weight:700;

    cursor:pointer;
}


button:disabled{
    opacity:.6;

    cursor:not-allowed;
}


.approve-btn{
    background:#16a34a;
}


.approve-btn:hover{
    background:#15803d;
}


.reject-btn{
    background:#dc2626;
}


.reject-btn:hover{
    background:#b91c1c;
}


.view-btn{
    background:#2563eb;
}


.view-btn:hover{
    background:#1d4ed8;
}


/* ================================
   WITHDRAWAL
================================ */

.withdrawal{
    border:1px solid #e5e7eb;

    border-radius:12px;

    padding:20px;

    margin-bottom:15px;
}


.withdrawal-top{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:15px;
}


.withdrawal-amount{
    color:#16a34a;

    font-size:26px;

    font-weight:800;
}


.withdrawal-status{
    padding:6px 11px;

    border-radius:20px;

    font-size:12px;

    font-weight:700;
}


.withdrawal-status.pending{
    background:#fef3c7;

    color:#92400e;
}


.withdrawal-status.paid,
.withdrawal-status.approved{
    background:#dcfce7;

    color:#166534;
}


.withdrawal-status.rejected{
    background:#fee2e2;

    color:#991b1b;
}


.withdrawal-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-bottom:15px;
}


.withdrawal-info{
    background:#f8fafc;

    padding:12px;

    border-radius:8px;

    overflow-wrap:anywhere;
}


.withdrawal-info small{
    display:block;

    color:#64748b;

    font-size:11px;

    margin-bottom:5px;
}


.withdrawal-info strong{
    font-size:14px;
}


/* ================================
   LOADING / EMPTY / ERROR
================================ */

.loading{
    color:#64748b;

    padding:20px 0;
}


.empty{
    text-align:center;

    color:#64748b;

    padding:35px 20px;
}


.error-box{
    color:#991b1b;

    background:#fef2f2;

    border:1px solid #fecaca;

    padding:15px;

    border-radius:8px;
}


/* ================================
   MOBILE
================================ */

@media(max-width:1000px){

    .cards{
        grid-template-columns:
            repeat(2,1fr);
    }


    .withdrawal-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}


@media(max-width:800px){

    .sidebar{
        position:relative;

        width:100%;

        height:auto;

        padding-bottom:70px;
    }


    .logout{
        position:absolute;

        left:15px;
        right:15px;

        bottom:15px;
    }


    .main{
        margin-left:0;

        padding:20px;
    }


    .cards{
        grid-template-columns:1fr;
    }


    .topbar{
        display:block;
    }


    .admin-name{
        display:inline-block;

        margin-top:12px;
    }


    .job{
        display:block;
    }


    .actions{
        margin-top:15px;
    }


    .withdrawal-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<main class="main">

<script type="module">


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rvwboegeisnrhwicvvhj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Kz3hgj9W0khG3JEIclhx2g_HZ6eSyQQ";


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type="success"
){

    const message =
    document.getElementById(
        "message"
    );


    message.textContent =
    text;


    message.className =
    "message " +
    type;


    setTimeout(
        function(){

            message.className =
            "message";

        },
        5000
    );

}


/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdmin(){


    const {
        data:{
            user
        },
        error:userError
    } =
    await supabase
        .auth
        .getUser();


    if(
        userError ||
        !user
    ){

        window.location.href =
        "login.html";

        return null;

    }


    const {
        data:profile,
        error:profileError
    } =
    await supabase

        .from("profiles")

        .select("*")

        .eq(
            "id",
            user.id
        )

        .single();


    if(profileError){

        console.error(
            profileError
        );


        alert(
            "Unable to load admin profile."
        );


        return null;

    }


    if(
        profile.role !==
        "admin"
    ){

        if(
            profile.role ===
            "worker"
        ){

            window.location.href =
            "worker-dashboard.html";

        }

        else if(
            profile.role ===
            "employer"
        ){

            window.location.href =
            "employer-dashboard.html";

        }

        else{

            window.location.href =
            "login.html";

        }


        return null;

    }


    document.getElementById(
        "adminName"
    ).textContent =

        profile.full_name ||
        profile.username ||
        "Admin";


    return user;

}


/* =========================================
   LOAD JOB COUNTS
========================================= */

async function loadCounts(){


    const {
        count:totalCount
    } =
    await supabase

        .from("jobs")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        );


    document.getElementById(
        "totalCount"
    ).textContent =

        totalCount || 0;


    const {
        count:pendingCount
    } =
    await supabase

        .from("jobs")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )

        .eq(
            "status",
            "pending"
        );


    document.getElementById(
        "pendingCount"
    ).textContent =

        pendingCount || 0;


    const {
        count:activeCount
    } =
    await supabase

        .from("jobs")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )

        .eq(
            "status",
            "active"
        );


    document.getElementById(
        "activeCount"
    ).textContent =

        activeCount || 0;

}


/* =========================================
   LOAD PENDING WITHDRAWAL COUNT
========================================= */

async function loadWithdrawalCount(){


    const {
        count,
        error
    } =
    await supabase

        .from("withdrawals")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )

        .eq(
            "status",
            "pending"
        );


    if(error){

        console.error(
            "Withdrawal count error:",
            error
        );


        document.getElementById(
            "pendingWithdrawalCount"
        ).textContent =
        "0";


        return;

    }


    document.getElementById(
        "pendingWithdrawalCount"
    ).textContent =

        count || 0;

}


/* =========================================
   LOAD PENDING JOBS
========================================= */

async function loadPendingJobs(){


    const list =
    document.getElementById(
        "pendingJobsList"
    );


    list.innerHTML = `

        <div class="loading">
            Loading pending jobs...
        </div>

    `;


    const {
        data:jobs,
        error
    } =
    await supabase

        .from("jobs")

        .select("*")

        .eq(
            "status",
            "pending"
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        list.innerHTML = `

            <div class="error-box">

                Unable to load pending jobs.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if(
        !jobs ||
        jobs.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                🎉

                <br><br>

                No pending jobs.

            </div>

        `;

        return;

    }


    list.innerHTML =
    "";


    jobs.forEach(
        job => {

            createJobCard(
                job,
                list,
                true
            );

        }
    );

}


/* =========================================
   LOAD ALL JOBS
========================================= */

async function loadAllJobs(){


    const list =
    document.getElementById(
        "allJobsList"
    );


    list.innerHTML = `

        <div class="loading">
            Loading jobs...
        </div>

    `;


    const {
        data:jobs,
        error
    } =
    await supabase

        .from("jobs")

        .select("*")

        .order(
            "created_at",
            {
                ascending:false
            }
        )

        .limit(100);


    if(error){

        list.innerHTML = `

            <div class="error-box">

                Unable to load jobs.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if(
        !jobs ||
        jobs.length === 0
    ){

        list.innerHTML = `

            <div class="empty">
                No jobs found.
            </div>

        `;

        return;

    }


    list.innerHTML =
    "";


    jobs.forEach(
        job => {

            createJobCard(
                job,
                list,
                false
            );

        }
    );

}


/* =========================================
   CREATE JOB CARD
========================================= */

function createJobCard(
    job,
    container,
    pendingOnly
){


    const item =
    document.createElement(
        "div"
    );


    item.className =
    "job";


    const reward =
    Number(
        job.reward ??
        job.reward_per_worker ??
        0
    );


    const workers =
    Number(
        job.workers_needed ??
        job.workers ??
        0
    );


    const status =
    job.status ||
    "pending";


    item.innerHTML = `

        <div class="job-info">


            <div>

                <span class="badge category">

                    ${escapeHtml(
                        job.category ||
                        "Other"
                    )}

                </span>


                <span
                    class="badge ${escapeHtml(status)}"
                >

                    ${escapeHtml(
                        status
                    )}

                </span>

            </div>


            <h3>

                ${escapeHtml(
                    job.title ||
                    "Untitled Job"
                )}

            </h3>


            <p>

                Subcategory:
                ${escapeHtml(
                    job.subcategory ||
                    "General"
                )}

            </p>


            <p>

                Workers Needed:
                ${workers}

            </p>


            <p>

                Deadline:
                ${escapeHtml(
                    job.deadline ||
                    "No deadline"
                )}

            </p>


        </div>


        <div>


            <div class="reward">

                $${reward.toFixed(2)}

            </div>


            <div class="actions">


                <button
                    class="view-btn"
                    data-job-id="${escapeHtml(job.id)}"
                >
                    View
                </button>


                ${
                    pendingOnly
                    ?
                    `

                    <button
                        class="approve-btn"
                        data-approve-job="${escapeHtml(job.id)}"
                    >
                        ✓ Approve
                    </button>


                    <button
                        class="reject-btn"
                        data-reject-job="${escapeHtml(job.id)}"
                    >
                        ✕ Reject
                    </button>

                    `
                    :
                    ""
                }


            </div>


        </div>

    `;


    container.appendChild(
        item
    );


    const viewButton =
    item.querySelector(
        "[data-job-id]"
    );


    viewButton.addEventListener(
        "click",
        function(){

            window.open(
                "job.html?id=" +
                encodeURIComponent(
                    job.id
                ),
                "_blank"
            );

        }
    );


    if(pendingOnly){


        const approveButton =
        item.querySelector(
            "[data-approve-job]"
        );


        const rejectButton =
        item.querySelector(
            "[data-reject-job]"
        );


        approveButton.addEventListener(
            "click",
            function(){

                approveJob(
                    job.id
                );

            }
        );


        rejectButton.addEventListener(
            "click",
            function(){

                rejectJob(
                    job.id
                );

            }
        );

    }

}


/* =========================================
   APPROVE JOB
========================================= */

async function approveJob(jobId){


    const confirmed =
    confirm(
        "Are you sure you want to approve this job?"
    );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
    await supabase

        .from("jobs")

        .update({
            status:"active"
        })

        .eq(
            "id",
            jobId
        )

        .eq(
            "status",
            "pending"
        );


    if(error){

        showMessage(
            "Approve failed: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "Job approved successfully."
    );


    await loadCounts();

    await loadPendingJobs();

    await loadAllJobs();

}


/* =========================================
   REJECT JOB
========================================= */

async function rejectJob(jobId){


    const confirmed =
    confirm(
        "Are you sure you want to reject this job?"
    );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
    await supabase

        .from("jobs")

        .update({
            status:"rejected"
        })

        .eq(
            "id",
            jobId
        )

        .eq(
            "status",
            "pending"
        );


    if(error){

        showMessage(
            "Reject failed: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "Job rejected successfully."
    );


    await loadCounts();

    await loadPendingJobs();

    await loadAllJobs();

}


/* =========================================
   LOAD WITHDRAWALS
========================================= */

async function loadWithdrawals(){


    const list =
    document.getElementById(
        "withdrawalsList"
    );


    list.innerHTML = `

        <div class="loading">
            Loading withdrawal requests...
        </div>

    `;


    const {
        data:withdrawals,
        error
    } =
    await supabase

        .from("withdrawals")

        .select(`
            id,
            user_id,
            amount,
            payment_method,
            payment_account,
            status,
            created_at
        `)

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            error
        );


        list.innerHTML = `

            <div class="error-box">

                Unable to load withdrawal requests.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    if(
        !withdrawals ||
        withdrawals.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                💸

                <br><br>

                No withdrawal requests found.

            </div>

        `;

        return;

    }


    list.innerHTML =
    "";


    withdrawals.forEach(
        withdrawal => {

            createWithdrawalCard(
                withdrawal,
                list
            );

        }
    );

}


/* =========================================
   CREATE WITHDRAWAL CARD
========================================= */

function createWithdrawalCard(
    withdrawal,
    container
){


    const item =
    document.createElement(
        "div"
    );


    item.className =
    "withdrawal";


    const amount =
    Number(
        withdrawal.amount || 0
    );


    const status =
    withdrawal.status ||
    "pending";


    const date =
    withdrawal.created_at
    ?
    new Date(
        withdrawal.created_at
    ).toLocaleString()
    :
    "-";


    let statusText =
    "⏳ Pending";


    if(
        status ===
        "paid"
    ){

        statusText =
        "✅ Paid";

    }


    else if(
        status ===
        "approved"
    ){

        statusText =
        "✅ Approved";

    }


    else if(
        status ===
        "rejected"
    ){

        statusText =
        "❌ Rejected";

    }


    const isPending =
    status ===
    "pending";


    item.innerHTML = `

        <div class="withdrawal-top">


            <div class="withdrawal-amount">

                $${amount.toFixed(2)}

            </div>


            <div
                class="withdrawal-status ${escapeHtml(status)}"
            >

                ${statusText}

            </div>


        </div>


        <div class="withdrawal-grid">


            <div class="withdrawal-info">

                <small>
                    Worker ID
                </small>

                <strong>
                    ${escapeHtml(
                        withdrawal.user_id
                    )}
                </strong>

            </div>


            <div class="withdrawal-info">

                <small>
                    Payment Method
                </small>

                <strong>
                    ${escapeHtml(
                        withdrawal.payment_method ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="withdrawal-info">

                <small>
                    Account Details
                </small>

                <strong>
                    ${escapeHtml(
                        withdrawal.payment_account ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="withdrawal-info">

                <small>
                    Request Date
                </small>

                <strong>
                    ${escapeHtml(
                        date
                    )}
                </strong>

            </div>


        </div>


        ${
            isPending
            ?
            `

            <div class="actions">

                <button
                    class="approve-btn"
                    data-approve-withdrawal="${escapeHtml(withdrawal.id)}"
                >
                    ✓ Approve Payment
                </button>


                <button
                    class="reject-btn"
                    data-reject-withdrawal="${escapeHtml(withdrawal.id)}"
                >
                    ✕ Reject
                </button>

            </div>

            `
            :
            ""
        }

    `;


    container.appendChild(
        item
    );


    if(isPending){


        const approveButton =
        item.querySelector(
            "[data-approve-withdrawal]"
        );


        const rejectButton =
        item.querySelector(
            "[data-reject-withdrawal]"
        );


        approveButton.addEventListener(
            "click",
            function(){

                approveWithdrawal(
                    withdrawal.id
                );

            }
        );


        rejectButton.addEventListener(
            "click",
            function(){

                rejectWithdrawal(
                    withdrawal.id
                );

            }
        );

    }

}


/* =========================================
   APPROVE WITHDRAWAL
========================================= */

async function approveWithdrawal(
    withdrawalId
){


    const confirmed =
    confirm(
        "Are you sure you want to approve this withdrawal payment?"
    );


    if(!confirmed){

        return;

    }


    try{


        /*
         * Existing Supabase approval function.
         *
         * It handles the withdrawal approval
         * and worker wallet deduction.
         */


        const {
            data,
            error
        } =
        await supabase

            .rpc(
                "approve_withdrawal",
                {
                    withdrawal_id:
                    withdrawalId
                }
            );


        if(error){

            console.error(
                "Approval error:",
                error
            );


            showMessage(
                "Withdrawal approval failed: " +
                error.message,
                "error"
            );


            return;

        }


        if(
            data &&
            data.success === false
        ){

            showMessage(
                data.message ||
                "Withdrawal approval failed.",
                "error"
            );


            return;

        }


        showMessage(
            data?.message ||
            "Withdrawal approved successfully."
        );


        await loadWithdrawalCount();

        await loadWithdrawals();

    }


    catch(error){

        console.error(
            error
        );


        showMessage(
            "Withdrawal approval failed: " +
            error.message,
            "error"
        );

    }

}


/* =========================================
   REJECT WITHDRAWAL
========================================= */

async function rejectWithdrawal(
    withdrawalId
){


    const confirmed =
    confirm(
        "Are you sure you want to reject this withdrawal request?"
    );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
    await supabase

        .from("withdrawals")

        .update({

            status:
            "rejected"

        })

        .eq(
            "id",
            withdrawalId
        )

        .eq(
            "status",
            "pending"
        );


    if(error){

        console.error(
            "Reject withdrawal error:",
            error
        );


        showMessage(
            "Withdrawal rejection failed: " +
            error.message,
            "error"
        );


        return;

    }


    showMessage(
        "Withdrawal request rejected successfully."
    );


    await loadWithdrawalCount();

    await loadWithdrawals();

}

    const user =
    await checkAdmin();


    if(!user){

        return;

    }


    await loadCounts();

    await loadPendingJobs();

    await loadAllJobs();

    await loadWithdrawalCount();

    await loadWithdrawals();

}


startDashboard();
