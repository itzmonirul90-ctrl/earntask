<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - EarnTask</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ecfdf5, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .logo span {
            color: #16a34a;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            margin-bottom: 17px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #16a34a;
        }

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .role {
            border: 2px solid #e5e7eb;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }

        .role:hover {
            border-color: #16a34a;
        }

        .role input {
            width: auto;
            margin: 0 5px 0 0;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #16a34a;
            border: none;
            border-radius: 9px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login a {
            color: #16a34a;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        Earn<span>Task</span>
    </div>

    <p class="subtitle">
        Create your free account
    </p>

    <form id="registerForm">

        <label>Full Name</label>

        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
        >

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Choose a username"
            required
        >

        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            required
        >

        <label>Account Type</label>

        <div class="roles">

            <label class="role">
                <input
                    type="radio"
                    name="role"
                    value="worker"
                    checked
                >
                👤 Worker
            </label>

            <label class="role">
                <input
                    type="radio"
                    name="role"
                    value="employer"
                >
                💼 Employer
            </label>

        </div>

        <button id="registerButton" type="submit">
            Create Account
        </button>

        <div id="message"></div>

    </form>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>


<script type="module">

    /*
      IMPORTANT:
      Replace the two values below with YOUR OWN
      Supabase API URL and Publishable Key.
    */

    const SUPABASE_URL = "sb_publishable_Kz3hgj9W0khG3JEIclhx2g_HZ6eSyQQ";

    const SUPABASE_KEY = "https://rvwboegeisnrhwicvvhj.supabase.co/rest/v1/";


    import {
        createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    const form = document.getElementById("registerForm");

    const message = document.getElementById("message");

    const button = document.getElementById("registerButton");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.textContent = "";
        message.style.color = "#dc2626";

        button.disabled = true;
        button.textContent = "Creating Account...";


        const fullName =
            document.getElementById("fullName").value.trim();

        const username =
            document.getElementById("username").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const role =
            document.querySelector(
                'input[name="role"]:checked'
            ).value;


        try {

            /*
              Create Supabase Auth account
            */

            const {
                data,
                error
            } = await supabase.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {

                        full_name: fullName,

                        username: username,

                        role: role

                    }

                }

            });


            if (error) {
                throw error;
            }


            message.style.color = "#16a34a";

            message.textContent =
                "Account created successfully! You can now login.";

            form.reset();


            /*
              If email confirmation is enabled,
              Supabase will ask the user to verify email.
            */

            if (
                data.user &&
                !data.session
            ) {

                message.textContent =
                    "Account created! Please check your email to confirm your account.";

            }


        } catch (error) {

            console.error(error);

            message.style.color = "#dc2626";

            message.textContent =
                error.message || "Registration failed.";

        }


        button.disabled = false;

        button.textContent = "Create Account";

    });

</script>

</body>
</html>
