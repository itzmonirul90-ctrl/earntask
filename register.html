<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EarnTask</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ecfdf5, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-box {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #111827;
        }

        .logo span {
            color: #16a34a;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #16a34a;
        }

        .role-title {
            margin-bottom: 10px;
        }

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .role {
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
        }

        .role input {
            width: auto;
            margin: 0 5px 0 0;
        }

        .role:hover {
            border-color: #16a34a;
        }

        button {
            width: 100%;
            border: none;
            background: #16a34a;
            color: white;
            padding: 14px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #dc2626;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .login-link a {
            color: #16a34a;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo">
        Earn<span>Task</span>
    </div>

    <p class="subtitle">
        Create your free account
    </p>

    <form id="registerForm">

        <label for="fullName">Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
        >

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            placeholder="Choose a username"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <div class="role-title">
            <label>Choose Account Type</label>
        </div>

        <div class="roles">

            <label class="role">
                <input
                    type="radio"
                    name="role"
                    value="worker"
                    checked
                >
                👤 Worker
            </label>

            <label class="role">
                <input
                    type="radio"
                    name="role"
                    value="employer"
                >
                💼 Employer
            </label>

        </div>

        <button type="submit">
            Create Account
        </button>

        <div class="message" id="message"></div>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const role = document.querySelector(
        'input[name="role"]:checked'
    ).value;

    const message = document.getElementById("message");

    message.style.color = "#16a34a";

    message.innerText =
        "Registration page is ready. Supabase connection will be added next.";

    console.log({
        fullName,
        username,
        email,
        password,
        role
    });

});

</script>

</body>
</html>
