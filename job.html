<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Job Details - EarnTask</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f8fafc;
    color:#172033;
}

.header{
    background:#111827;
    color:white;
    padding:18px 30px;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.logo span{
    color:#22c55e;
}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:0 20px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#2563eb;
    text-decoration:none;
    font-weight:700;
}

.card{
    background:white;
    border-radius:15px;
    padding:30px;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
    margin-bottom:20px;
}

.job-title{
    font-size:30px;
    margin-bottom:15px;
}

.badges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.badge{
    display:inline-block;
    padding:7px 12px;
    border-radius:7px;
    font-size:13px;
    font-weight:700;
}

.category{
    background:#eff6ff;
    color:#2563eb;
}

.status{
    background:#dcfce7;
    color:#166534;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin:25px 0;
}

.info-box{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    padding:18px;
    border-radius:10px;
}

.info-box small{
    display:block;
    color:#64748b;
    margin-bottom:7px;
}

.info-box strong{
    font-size:20px;
}

.section-title{
    font-size:20px;
    margin-bottom:12px;
}

.description{
    color:#475569;
    line-height:1.7;
    white-space:pre-wrap;
}

.instructions{
    background:#f8fafc;
    border-left:4px solid #16a34a;
    padding:18px;
    border-radius:8px;
    line-height:1.7;
    white-space:pre-wrap;
}

.proof-list{
    margin-top:10px;
    padding-left:22px;
}

.proof-list li{
    margin:8px 0;
}

.action-area{
    text-align:center;
    padding-top:10px;
}

.start-btn{
    border:none;
    background:#16a34a;
    color:white;
    padding:14px 30px;
    border-radius:9px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.start-btn:hover{
    background:#15803d;
}

.start-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    padding:14px;
    border-radius:8px;
    margin-bottom:20px;
}

.message.error{
    display:block;
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#b91c1c;
}

.message.success{
    display:block;
    background:#dcfce7;
    border:1px solid #bbf7d0;
    color:#166534;
}

.loading{
    text-align:center;
    padding:60px 20px;
    color:#64748b;
}

.error-page{
    text-align:center;
    color:#b91c1c;
    padding:60px 20px;
}

@media(max-width:700px){

    .header{
        padding:15px 20px;
    }

    .container{
        margin:20px auto;
        padding:0 15px;
    }

    .card{
        padding:20px;
    }

    .job-title{
        font-size:24px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="logo">
        Earn<span>Task</span>
    </div>

</header>


<main class="container">

    <a
        href="worker-dashboard.html"
        class="back"
    >
        ← Back to Worker Dashboard
    </a>


    <div id="message" class="message"></div>


    <div id="jobContainer">

        <div class="loading">
            Loading job details...
        </div>

    </div>

</main>


<script type="module">


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rvwboegeisnrhwicvvhj.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Kz3hgj9W0khG3JEIclhx2g_HZ6eSyQQ";


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   GET JOB ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const jobId =
    params.get("id");


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type="error"
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        text;

    box.className =
        "message " + type;

}


/* =========================================
   LOAD JOB
========================================= */

async function loadJob(){

    const container =
        document.getElementById(
            "jobContainer"
        );


    if(!jobId){

        container.innerHTML =

            `
            <div class="error-page">
                Job ID is missing.
            </div>
            `;

        return;

    }


    /* ==============================
       CHECK USER
    ============================== */

    const {
        data:{
            user
        },
        error:userError
    } =
    await supabase.auth.getUser();


    if(
        userError ||
        !user
    ){

        window.location.href =
            "login.html";

        return;

    }


    /* ==============================
       CHECK PROFILE
    ============================== */

    const {
        data:profile,
        error:profileError
    } =
    await supabase

        .from("profiles")

        .select("*")

        .eq(
            "id",
            user.id
        )

        .single();


    if(profileError){

        console.error(
            profileError
        );

        container.innerHTML =

            `
            <div class="error-page">
                Unable to load your profile.
            </div>
            `;

        return;

    }


    if(
        profile.role !==
        "worker"
    ){

        container.innerHTML =

            `
            <div class="error-page">
                Only workers can access jobs.
            </div>
            `;

        return;

    }


    /* ==============================
       LOAD JOB
    ============================== */

    const {
        data:job,
        error:jobError
    } =
    await supabase

        .from("jobs")

        .select("*")

        .eq(
            "id",
            jobId
        )

        .single();


    if(jobError){

        console.error(
            jobError
        );

        container.innerHTML =

            `
            <div class="error-page">

                Unable to load this job.

                <br><br>

                ${escapeHtml(
                    jobError.message
                )}

            </div>
            `;

        return;

    }


    if(!job){

        container.innerHTML =

            `
            <div class="error-page">
                Job not found.
            </div>
            `;

        return;

    }


    /* ==============================
       CHECK JOB STATUS
    ============================== */

    const status =
        job.status || "pending";


    const reward =
        Number(
            job.reward ??
            job.reward_per_worker ??
            0
        );


    const workersNeeded =
        Number(
            job.workers_needed ??
            job.worker_count ??
            job.workers ??
            0
        );


    const workersCompleted =
        Number(
            job.workers_completed ??
            0
        );


    /* ==============================
       PROOF REQUIREMENTS
    ============================== */

    let proofHtml =
        "<li>No proof requirements specified.</li>";


    if(
        Array.isArray(
            job.proof_requirements
        ) &&
        job.proof_requirements.length > 0
    ){

        proofHtml =
            job.proof_requirements
                .map(
                    function(item){

                        if(
                            typeof item ===
                            "object"
                        ){

                            return `
                                <li>
                                    ${escapeHtml(
                                        item.text ||
                                        item.type ||
                                        JSON.stringify(item)
                                    )}
                                </li>
                            `;

                        }

                        return `
                            <li>
                                ${escapeHtml(item)}
                            </li>
                        `;

                    }
                )
                .join("");

    }


    /* ==============================
       DEADLINE
    ============================== */

    const deadline =
        job.deadline ||
        "No deadline";


    /* ==============================
       LOCATION
    ============================== */

    let locationText =
        job.location_type ||
        "International";


    if(
        job.location_type ===
        "specific"
    ){

        if(
            Array.isArray(
                job.countries
            ) &&
            job.countries.length > 0
        ){

            locationText =
                job.countries.join(", ");

        }

    }


    /* ==============================
       DISPLAY
    ============================== */

    container.innerHTML =

        `

        <div class="card">


            <h1 class="job-title">

                ${escapeHtml(
                    job.title ||
                    "Untitled Job"
                )}

            </h1>


            <div class="badges">

                <span class="badge category">

                    ${escapeHtml(
                        job.category ||
                        "Other"
                    )}

                </span>


                <span class="badge category">

                    ${escapeHtml(
                        job.subcategory ||
                        "General"
                    )}

                </span>


                <span class="badge status">

                    ${escapeHtml(
                        status
                    )}

                </span>

            </div>



            <div class="info-grid">


                <div class="info-box">

                    <small>
                        Reward per Worker
                    </small>

                    <strong>
                        ৳${reward.toFixed(2)}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Workers
                    </small>

                    <strong>
                        ${workersCompleted}/${workersNeeded}
                    </strong>

                </div>


                <div class="info-box">

                    <small>
                        Deadline
                    </small>

                    <strong>
                        ${escapeHtml(
                            deadline
                        )}
                    </strong>

                </div>


            </div>



            <div class="info-box">

                <small>
                    Worker Location
                </small>

                <strong>
                    ${escapeHtml(
                        locationText
                    )}
                </strong>

            </div>

        </div>



        <div class="card">

            <h2 class="section-title">
                Job Description
            </h2>

            <div class="description">

                ${escapeHtml(
                    job.description ||
                    "No description provided."
                )}

            </div>

        </div>



        <div class="card">

            <h2 class="section-title">
                Instructions
            </h2>

            <div class="instructions">

                ${escapeHtml(
                    job.instructions ||
                    "No special instructions provided."
                )}

            </div>

        </div>



        <div class="card">

            <h2 class="section-title">
                Proof Requirements
            </h2>

            <ul class="proof-list">

                ${proofHtml}

            </ul>

        </div>



        <div class="card action-area">

            <button
                id="startJobBtn"
                class="start-btn"
            >
                🚀 Start Job
            </button>

        </div>

        `;


    /* ==============================
       START BUTTON
    ============================== */

    const startButton =
        document.getElementById(
            "startJobBtn"
        );


    startButton.addEventListener(
        "click",
        function(){

            startJob(
                job,
                user
            );

        }
    );

}


/* =========================================
   START JOB
========================================= */

async function startJob(
    job,
    user
){

    const button =
        document.getElementById(
            "startJobBtn"
        );


    button.disabled = true;


    button.textContent =
        "Starting...";


    showMessage(
        "",
        "success"
    );


    /* ==============================
       CHECK EXISTING SUBMISSION
    ============================== */

    const {
        data:existing,
        error:existingError
    } =
    await supabase

        .from("job_submissions")

        .select("id,status")

        .eq(
            "job_id",
            job.id
        )

        .eq(
            "worker_id",
            user.id
        )
        
        .limit(1);


    if(existingError){

        console.error(
            existingError
        );

        showMessage(
            "Unable to check your previous submission: " +
            existingError.message,
            "error"
        );

        button.disabled = false;

        button.textContent =
            "🚀 Start Job";

        return;

    }


    /* ==============================
       ALREADY STARTED / SUBMITTED
    ============================== */

    if(
        existing &&
        existing.length > 0
    ){

        const submission =
            existing[0];


        window.location.href =
            "submit-job.html?id=" +
            encodeURIComponent(
                job.id
            );

        return;

    }


    /* ==============================
       CREATE SUBMISSION
       IMPORTANT:
       STATUS = pending
    ============================== */

    const {
        data:submission,
        error:submissionError
    } =
    await supabase

        .from("job_submissions")

        .insert({

            job_id:
                job.id,

            worker_id:
                user.id,

            status:
                "pending"

        })

        .select()
        .single();


    if(submissionError){

        console.error(
            submissionError
        );


        showMessage(
            "Start Job failed: " +
            submissionError.message,
            "error"
        );


        button.disabled = false;

        button.textContent =
            "🚀 Start Job";

        return;

    }


    /* ==============================
       SUCCESS
    ============================== */

    showMessage(
        "Job started successfully.",
        "success"
    );


    setTimeout(
        function(){

            window.location.href =
                "submit-job.html?id=" +
                encodeURIComponent(
                    job.id
                );

        },
        700
    );

}


/* =========================================
   START
========================================= */

loadJob();

</script>

</body>

</html>
