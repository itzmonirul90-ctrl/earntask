<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard - EarnTask</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    color: #172033;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 240px;
    height: 100vh;
    background: #111827;
    color: white;
    padding: 25px 15px;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 35px;
}

.logo span {
    color: #22c55e;
}

.sidebar a {
    display: block;
    color: #d1d5db;
    text-decoration: none;
    padding: 13px 15px;
    margin-bottom: 7px;
    border-radius: 8px;
}

.sidebar a:hover,
.sidebar a.active {
    background: #16a34a;
    color: white;
}

.logout {
    position: absolute;
    bottom: 25px;
    left: 15px;
    right: 15px;
    background: #dc2626 !important;
    text-align: center;
}

.main {
    margin-left: 240px;
    padding: 30px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.topbar h1 {
    font-size: 30px;
}

.user-name {
    background: white;
    padding: 10px 18px;
    border-radius: 10px;
    box-shadow: 0 3px 15px rgba(0,0,0,.05);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.stat {
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.stat h3 {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 8px;
}

.stat-number {
    font-size: 28px;
    font-weight: 800;
}

.section {
    background: white;
    padding: 25px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.section h2 {
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #16a34a;
}

button {
    border: none;
    background: #16a34a;
    color: white;
    padding: 13px 22px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    background: #15803d;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    margin-top: 15px;
    line-height: 1.5;
}

.job {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 12px;
}

.job-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.job h3 {
    margin-bottom: 8px;
}

.job p {
    color: #64748b;
    margin-bottom: 7px;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    background: #ecfdf5;
    color: #15803d;
    font-size: 13px;
    font-weight: 700;
}

.error {
    color: #dc2626;
}

.loading {
    color: #64748b;
}

@media (max-width: 850px) {
    .sidebar {
        width: 200px;
    }

    .main {
        margin-left: 200px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }
}

@media (max-width: 650px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .logout {
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">

    <div class="logo">
        Earn<span>Task</span>
    </div>

    <a href="employer-dashboard.html" class="active">
        🏠 Dashboard
    </a>

    <a href="#post-job">
        ➕ Post a Job
    </a>

    <a href="#my-jobs">
        📋 My Jobs
    </a>

    <a href="#profile">
        👤 Profile
    </a>

    <a href="#" class="logout" id="logoutBtn">
        🚪 Logout
    </a>

</aside>


<main class="main">

    <div class="topbar">
        <h1>Employer Dashboard</h1>

        <div class="user-name" id="userName">
            Loading...
        </div>
    </div>


    <div class="stats">

        <div class="stat">
            <h3>Total Jobs</h3>
            <div class="stat-number" id="totalJobs">0</div>
        </div>

        <div class="stat">
            <h3>Active Jobs</h3>
            <div class="stat-number" id="activeJobs">0</div>
        </div>

        <div class="stat">
            <h3>Workers Needed</h3>
            <div class="stat-number" id="workersNeeded">0</div>
        </div>

    </div>


    <section class="section" id="post-job">

        <h2>➕ Post a New Job</h2>

        <form id="jobForm">

            <div class="form-grid">

                <div class="full">

                    <label for="title">
                        Job Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Website Testing"
                        required
                    >

                </div>


                <div>

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Website Tasks">
                            Website Tasks
                        </option>

                        <option value="App Testing">
                            App Testing
                        </option>

                        <option value="Data Entry">
                            Data Entry
                        </option>

                        <option value="Research">
                            Research
                        </option>

                        <option value="Content Writing">
                            Content Writing
                        </option>

                        <option value="Design Tasks">
                            Design Tasks
                        </option>

                        <option value="Social Media">
                            Social Media
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div>

                    <label for="reward">
                        Reward per Worker ($)
                    </label>

                    <input
                        type="number"
                        id="reward"
                        min="0.01"
                        step="0.01"
                        placeholder="Example: 0.50"
                        required
                    >

                </div>


                <div>

                    <label for="workers">
                        Number of Workers
                    </label>

                    <input
                        type="number"
                        id="workers"
                        min="1"
                        max="10000"
                        placeholder="Example: 10"
                        required
                    >

                </div>


                <div>

                    <label for="deadline">
                        Deadline
                    </label>

                    <input
                        type="datetime-local"
                        id="deadline"
                        required
                    >

                </div>


                <div class="full">

                    <label for="description">
                        Job Instructions
                    </label>

                    <textarea
                        id="description"
                        placeholder="Explain clearly what the worker needs to do..."
                        required
                    ></textarea>

                </div>


                <div class="full">

                    <button
                        type="submit"
                        id="postButton"
                    >
                        Post Job
                    </button>

                    <div
                        class="message"
                        id="message"
                    ></div>

                </div>

            </div>

        </form>

    </section>


    <section class="section" id="my-jobs">

        <h2>📋 My Jobs</h2>

        <div id="jobsList">

            <div class="loading">
                Loading your jobs...
            </div>

        </div>

    </section>


    <section class="section" id="profile">

        <h2>👤 Profile</h2>

        <p>
            <strong>Name:</strong>
            <span id="profileName">Loading...</span>
        </p>

        <br>

        <p>
            <strong>Username:</strong>
            <span id="profileUsername">Loading...</span>
        </p>

        <br>

        <p>
            <strong>Role:</strong>
            <span id="profileRole">Loading...</span>
        </p>

    </section>

</main>


<script type="module">

const SUPABASE_URL =
    "https://rvwboegeisnrhwicvvhj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Kz3hgj9W0khG3JEIclhx2g_HZ6eSyQQ";


import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;


/*
 * Load employer dashboard
 */

async function loadDashboard() {

    const {
        data: {
            user
        }
    } = await supabase.auth.getUser();


    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser = user;


    /*
     * Load profile
     */

    const {
        data: profile,
        error: profileError
    } = await supabase

        .from("profiles")

        .select("*")

        .eq("id", user.id)

        .single();


    if (profileError) {

        console.error(profileError);

        return;

    }


    /*
     * Only employer can use this page.
     */

    if (profile.role !== "employer") {

        if (profile.role === "worker") {

            window.location.href =
                "worker-dashboard.html";

        } else if (profile.role === "admin") {

            window.location.href =
                "admin-dashboard.html";

        }

        return;

    }


    document.getElementById(
        "userName"
    ).textContent =
        profile.full_name ||
        profile.username ||
        "Employer";


    document.getElementById(
        "profileName"
    ).textContent =
        profile.full_name || "-";


    document.getElementById(
        "profileUsername"
    ).textContent =
        profile.username || "-";


    document.getElementById(
        "profileRole"
    ).textContent =
        profile.role;


    await loadJobs();

}


/*
 * Load employer jobs
 */

async function loadJobs() {

    const {
        data: jobs,
        error
    } = await supabase

        .from("jobs")

        .select("*")

        .eq("employer_id", currentUser.id)

        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        document.getElementById(
            "jobsList"
        ).innerHTML =
            '<div class="error">Unable to load jobs.</div>';

        return;

    }


    const jobsList =
        document.getElementById("jobsList");


    document.getElementById(
        "totalJobs"
    ).textContent =
        jobs.length;


    const activeCount =
        jobs.filter(function(job) {

            return (
                job.status === "active" ||
                job.status === "approved"
            );

        }).length;


    const workersNeeded =
        jobs.reduce(function(total, job) {

            const remaining =
                Math.max(
                    0,
                    Number(job.workers_needed || 0) -
                    Number(job.workers_completed || 0)
                );

            return total + remaining;

        }, 0);


    document.getElementById(
        "activeJobs"
    ).textContent =
        activeCount;


    document.getElementById(
        "workersNeeded"
    ).textContent =
        workersNeeded;


    if (jobs.length === 0) {

        jobsList.innerHTML =
            '<div class="loading">You have not posted any jobs yet.</div>';

        return;

    }


    jobsList.innerHTML = "";


    jobs.forEach(function(job) {

        const item =
            document.createElement("div");

        item.className = "job";


        const status =
            job.status || "pending";


        item.innerHTML = `

            <div class="job-header">

                <div>

                    <h3>
                        ${escapeHtml(job.title)}
                    </h3>

                    <p>
                        Category:
                        ${escapeHtml(job.category || "-")}
                    </p>

                    <p>
                        Reward:
                        $${Number(job.reward || 0).toFixed(2)}
                        per worker
                    </p>

                    <p>
                        Workers:
                        ${Number(job.workers_completed || 0)}
                        /
                        ${Number(job.workers_needed || 0)}
                    </p>

                </div>

                <div>

                    <span class="status">
                        ${escapeHtml(status)}
                    </span>

                </div>

            </div>

        `;


        jobsList.appendChild(item);

    });

}


/*
 * Post Job
 */

document
    .getElementById("jobForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const button =
                document.getElementById(
                    "postButton"
                );


            const message =
                document.getElementById(
                    "message"
                );


            button.disabled = true;

            button.textContent =
                "Posting Job...";


            message.textContent = "";


            const title =
                document.getElementById(
                    "title"
                ).value.trim();


            const category =
                document.getElementById(
                    "category"
                ).value;


            const reward =
                Number(
                    document.getElementById(
                        "reward"
                    ).value
                );


            const workers =
                Number(
                    document.getElementById(
                        "workers"
                    ).value
                );


            const deadline =
                document.getElementById(
                    "deadline"
                ).value;


            const description =
                document.getElementById(
                    "description"
                ).value.trim();


            try {

                if (
                    !title ||
                    !category ||
                    !description ||
                    reward <= 0 ||
                    workers <= 0 ||
                    !deadline
                ) {

                    throw new Error(
                        "Please fill all fields correctly."
                    );

                }


                /*
                 * Insert job into Supabase
                 */

                const {
                    error
                } = await supabase

                    .from("jobs")

                    .insert({

                        employer_id:
                            currentUser.id,

                        title:
                            title,

                        category:
                            category,

                        description:
                            description,

                        reward:
                            reward,

                        workers_needed:
                            workers,

                        workers_completed:
                            0,

                        deadline:
                            new Date(deadline)
                                .toISOString(),

                        status:
                            "pending"

                    });


                if (error) {

                    throw error;

                }


                message.style.color =
                    "#16a34a";


                message.textContent =
                    "Job posted successfully! It is now waiting for approval.";


                document
                    .getElementById("jobForm")
                    .reset();


                await loadJobs();


            } catch (error) {

                console.error(error);


                message.style.color =
                    "#dc2626";


                message.textContent =
                    error.message ||
                    "Unable to post job.";

            }


            button.disabled = false;

            button.textContent =
                "Post Job";

        }
    );


/*
 * HTML escape
 */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
 * Logout
 */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async function(event) {

            event.preventDefault();

            await supabase.auth.signOut();

            window.location.href =
                "login.html";

        }
    );


loadDashboard();

</script>

</body>
</html>
