<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EarnTask</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ecfdf5, #f8fafc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .logo span {
            color: #16a34a;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #16a34a;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .register-link a {
            color: #16a34a;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        Earn<span>Task</span>
    </div>

    <p class="subtitle">
        Login to your account
    </p>

    <form id="loginForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button id="loginButton" type="submit">
            Login
        </button>

        <div id="message"></div>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="register.html">Create Account</a>
    </div>

</div>


<script type="module">

    // আপনার নিজের Supabase তথ্য এখানে বসান

    const SUPABASE_URL = "https://rvwboegeisnrhwicvvhj.supabase.co";

    const SUPABASE_KEY = "sb_publishable_Kz3hgj9W0khG3JEIclhx2g_HZ6eSyQQ";


    import {
        createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    const form =
        document.getElementById("loginForm");

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.textContent = "";

        button.disabled = true;

        button.textContent = "Logging in...";


        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        try {

            const {
                data,
                error
            } = await supabase.auth.signInWithPassword({

                email: email,

                password: password

            });


            if (error) {
                throw error;
            }


            if (!data.user) {
                throw new Error("Login failed.");
            }


            message.style.color = "#16a34a";

            message.textContent =
                "Login successful!";


            /*
             * আমরা এখন User-এর role বের করব।
             */

            const {
                data: profile,
                error: profileError
            } = await supabase

                .from("profiles")

                .select("role")

                .eq("id", data.user.id)

                .single();


            if (profileError) {
                throw profileError;
            }


            /*
             * Role অনুযায়ী পরবর্তী dashboard।
             */

            setTimeout(function() {

                if (profile.role === "employer") {

                    window.location.href =
                        "employer-dashboard.html";

                } else if (profile.role === "admin") {

                    window.location.href =
                        "admin-dashboard.html";

                } else {

                    window.location.href =
                        "worker-dashboard.html";

                }

            }, 800);


        } catch (error) {

            console.error(error);

            message.style.color = "#dc2626";

            message.textContent =
                error.message || "Login failed.";

        }


        button.disabled = false;

        button.textContent = "Login";

    });

</script>

</body>
</html>
