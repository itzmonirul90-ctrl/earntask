<script type="module">


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rvwboegeisnrhwicvvhj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Kz3hgj9W0khG3JEIclhx2g_HZ6eSyQQ";


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text,
    type="success"
){

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        "message " + type;

    setTimeout(
        function(){

            message.className =
                "message";

        },
        4000
    );

}


/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdmin(){

    const {
        data:{
            user
        },
        error:userError
    } =
    await supabase.auth.getUser();


    if(
        userError ||
        !user
    ){

        window.location.href =
            "login.html";

        return null;

    }


    const {
        data:profile,
        error:profileError
    } =
    await supabase

        .from("profiles")

        .select("*")

        .eq(
            "id",
            user.id
        )

        .single();


    if(profileError){

        console.error(
            profileError
        );

        alert(
            "Unable to load profile."
        );

        return null;

    }


    if(
        profile.role !== "admin"
    ){

        if(
            profile.role === "worker"
        ){

            window.location.href =
                "worker-dashboard.html";

        }
        else if(
            profile.role === "employer"
        ){

            window.location.href =
                "employer-dashboard.html";

        }
        else{

            window.location.href =
                "login.html";

        }

        return null;

    }


    document.getElementById(
        "adminName"
    ).textContent =

        profile.full_name ||
        profile.username ||
        "Admin";


    return user;

}


/* =========================================
   LOAD COUNTS
========================================= */

async function loadCounts(){

    const pending =
        await supabase

        .from("job_submissions")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )

        .eq(
            "status",
            "pending"
        );


    const approved =
        await supabase

        .from("job_submissions")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )

        .eq(
            "status",
            "approved"
        );


    const rejected =
        await supabase

        .from("job_submissions")

        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )

        .eq(
            "status",
            "rejected"
        );


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending.count || 0;


    document.getElementById(
        "approvedCount"
    ).textContent =
        approved.count || 0;


    document.getElementById(
        "rejectedCount"
    ).textContent =
        rejected.count || 0;

}


/* =========================================
   LOAD SUBMISSIONS
========================================= */

async function loadSubmissions(){

    const list =
        document.getElementById(
            "submissionsList"
        );


    list.innerHTML =

        `
        <div class="loading">
            Loading submissions...
        </div>
        `;


    const {
        data:submissions,
        error
    } =
    await supabase

        .from("job_submissions")

        .select(`
            *,
            jobs(
                id,
                title,
                reward,
                category
            )
        `)

        .order(
            "submitted_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        list.innerHTML =

            `
            <div class="error">

                Unable to load submissions.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
            `;

        return;

    }


    if(
        !submissions ||
        submissions.length === 0
    ){

        list.innerHTML =

            `
            <div class="empty">

                📭

                <br><br>

                No submissions found.

            </div>
            `;

        return;

    }


    list.innerHTML = "";


    submissions.forEach(
        function(submission){

            createSubmissionCard(
                submission,
                list
            );

        }
    );

}


/* =========================================
   CREATE SUBMISSION CARD
========================================= */

function createSubmissionCard(
    submission,
    container
){

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "submission";


    const job =
        submission.jobs ||
        {};


    const status =
        submission.status ||
        "pending";


    const reward =
        Number(
            job.reward ??
            0
        );


    const proofText =
        submission.proof_text ||
        "No text answer provided.";


    const screenshotUrl =
        submission.screenshot_url ||
        "";


    let screenshotHTML = "";


    if(screenshotUrl){

        screenshotHTML =

            `
            <div class="screenshot-box">

                <div class="info-title">
                    Screenshot Proof
                </div>

                <img
                    src="${escapeHtml(
                        screenshotUrl
                    )}"
                    alt="Proof Screenshot"
                >

                <a
                    class="open-image"
                    href="${escapeHtml(
                        screenshotUrl
                    )}"
                    target="_blank"
                    rel="noopener"
                >
                    🖼️ Open Screenshot
                </a>

            </div>
            `;

    }
    else{

        screenshotHTML =

            `
            <div class="info">

                No screenshot uploaded.

            </div>
            `;

    }


    const submittedDate =
        submission.submitted_at
        ?
        new Date(
            submission.submitted_at
        ).toLocaleString()
        :
        "Unknown";


    const workerId =
        submission.worker_id ||
        "Unknown";


    item.innerHTML =

        `

        <div class="submission-header">

            <div>

                <div class="submission-title">

                    ${escapeHtml(
                        job.title ||
                        "Untitled Job"
                    )}

                </div>

                <div class="worker">

                    Worker ID:
                    ${escapeHtml(
                        workerId
                    )}

                </div>

                <div class="worker">

                    Submitted:
                    ${escapeHtml(
                        submittedDate
                    )}

                </div>

            </div>


            <div>

                <span class="badge ${escapeHtml(
                    status
                )}">

                    ${escapeHtml(
                        status
                    )}

                </span>

            </div>

        </div>


        <div class="info">

            <div class="info-title">
                Category
            </div>

            ${escapeHtml(
                job.category ||
                "Other"
            )}

        </div>


        <div class="info">

            <div class="info-title">
                Proof Text
            </div>

            <div class="proof-text">

                ${escapeHtml(
                    proofText
                )}

            </div>

        </div>


        ${screenshotHTML}


        <div
            style="
                margin-top:15px;
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:15px;
                flex-wrap:wrap;
            "
        >

            <div>

                <div class="info-title">
                    Worker Reward
                </div>

                <div class="reward">

                    $${reward.toFixed(2)}

                </div>

            </div>


            <div class="actions">

                ${
                    status === "pending"
                    ?
                    `

                    <button
                        class="approve-btn"
                        onclick="approveSubmission(
                            '${submission.id}'
                        )"
                    >
                        ✓ Approve
                    </button>


                    <button
                        class="reject-btn"
                        onclick="rejectSubmission(
                            '${submission.id}'
                        )"
                    >
                        ✕ Reject
                    </button>

                    `
                    :
                    ""
                }

            </div>

        </div>

        `;


    container.appendChild(
        item
    );

}


/* =========================================
   APPROVE SUBMISSION
========================================= */

window.approveSubmission =
async function(submissionId){

    const confirmed =
        confirm(
            "Approve this submission?"
        );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
    await supabase

        .from("job_submissions")

        .update({
            status:"approved"
        })

        .eq(
            "id",
            submissionId
        )

        .eq(
            "status",
            "pending"
        );


    if(error){

        console.error(error);

        showMessage(
            "Approve failed: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "Submission approved successfully."
    );


    await loadCounts();

    await loadSubmissions();

};


/* =========================================
   REJECT SUBMISSION
========================================= */

window.rejectSubmission =
async function(submissionId){

    const confirmed =
        confirm(
            "Reject this submission?"
        );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
    await supabase

        .from("job_submissions")

        .update({
            status:"rejected"
        })

        .eq(
            "id",
            submissionId
        )

        .eq(
            "status",
            "pending"
        );


    if(error){

        console.error(error);

        showMessage(
            "Reject failed: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "Submission rejected."
    );


    await loadCounts();

    await loadSubmissions();

};


/* =========================================
   LOGOUT
========================================= */

document
    .getElementById(
        "logoutBtn"
    )
    .addEventListener(
        "click",
        async function(event){

            event.preventDefault();


            await supabase
                .auth
                .signOut();


            window.location.href =
                "login.html";

        }
    );


/* =========================================
   START
========================================= */

async function startDashboard(){

    const user =
        await checkAdmin();


    if(!user){

        return;

    }


    await loadCounts();

    await loadSubmissions();

}


startDashboard();

</script>

</body>
