<script type="module">


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://rvwboegeisnrhwicvvhj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Kz3hgj9W0khG3JEIclhx2g_HZ6eSyQQ";


import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   SHOW ERROR
========================================= */

function showError(message){

    const list =
        document.getElementById(
            "submissionsList"
        );

    list.innerHTML =

        `<div class="error">
            ${escapeHtml(message)}
        </div>`;

}


/* =========================================
   CHECK ADMIN
========================================= */

async function checkAdmin(){

    const {
        data:{
            user
        },
        error
    } =
    await supabase.auth.getUser();


    if(error){

        showError(
            "Authentication error:\n" +
            error.message
        );

        return null;
    }


    if(!user){

        window.location.href =
            "login.html";

        return null;
    }


    const {
        data:profile,
        error:profileError
    } =
    await supabase

        .from("profiles")

        .select(
            "id,full_name,username,role"
        )

        .eq(
            "id",
            user.id
        )

        .single();


    if(profileError){

        showError(
            "Profile error:\n" +
            profileError.message
        );

        return null;
    }


    if(profile.role !== "admin"){

        if(profile.role === "worker"){

            window.location.href =
                "worker-dashboard.html";

        }else if(profile.role === "employer"){

            window.location.href =
                "employer-dashboard.html";

        }else{

            window.location.href =
                "login.html";

        }

        return null;
    }


    document.getElementById(
        "adminName"
    ).textContent =

        profile.full_name ||
        profile.username ||
        "Admin";


    return user;
}


/* =========================================
   LOAD SUBMISSIONS
========================================= */

async function loadSubmissions(){

    const list =
        document.getElementById(
            "submissionsList"
        );


    list.innerHTML =
        `<div class="loading">
            Loading submissions...
        </div>`;


    /*
     * First get submissions.
     */

    const {
        data:submissions,
        error
    } =
    await supabase

        .from("job_submissions")

        .select(
            "id,job_id,worker_id,status,proof_text,screenshot_url,submitted_at"
        )

        .order(
            "submitted_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "SUBMISSION ERROR:",
            error
        );

        showError(
            "Unable to load submissions.\n\n" +
            error.message
        );

        return;
    }


    console.log(
        "SUBMISSIONS:",
        submissions
    );


    /*
     * Update counts.
     */

    let pending = 0;
    let approved = 0;
    let rejected = 0;


    submissions.forEach(function(item){

        if(item.status === "pending"){
            pending++;
        }

        if(item.status === "approved"){
            approved++;
        }

        if(item.status === "rejected"){
            rejected++;
        }

    });


    document.getElementById(
        "pendingCount"
    ).textContent = pending;


    document.getElementById(
        "approvedCount"
    ).textContent = approved;


    document.getElementById(
        "rejectedCount"
    ).textContent = rejected;


    if(!submissions.length){

        list.innerHTML =
            `<div class="empty">
                No submissions found.
            </div>`;

        return;
    }


    list.innerHTML = "";


    /*
     * Get job information separately.
     */

    for(
        const submission
        of submissions
    ){

        let job = null;


        const {
            data:jobData
        } =
        await supabase

            .from("jobs")

            .select(
                "id,title,reward_per_worker,reward"
            )

            .eq(
                "id",
                submission.job_id
            )

            .maybeSingle();


        job = jobData;


        createSubmissionCard(
            submission,
            job,
            list
        );

    }

}


/* =========================================
   CREATE SUBMISSION CARD
========================================= */

function createSubmissionCard(
    submission,
    job,
    container
){

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "submission";


    const status =
        submission.status ||
        "pending";


    let statusClass =
        "status-pending";


    if(status === "approved"){
        statusClass =
            "status-approved";
    }

    if(status === "rejected"){
        statusClass =
            "status-rejected";
    }


    const reward =
        Number(
            job?.reward_per_worker ??
            job?.reward ??
            0
        );


    const date =
        submission.submitted_at
        ?
        new Date(
            submission.submitted_at
        ).toLocaleString()
        :
        "-";


    const screenshot =
        submission.screenshot_url
        ?
        `
        <div class="proof">

            <strong>
                Screenshot
            </strong>

            <img
                src="${escapeHtml(
                    submission.screenshot_url
                )}"
                class="screenshot"
                alt="Worker screenshot"
            >

        </div>
        `
        :
        "";


    const proofText =
        submission.proof_text
        ||
        "No text proof submitted.";


    const actions =
        status === "pending"
        ?
        `
        <div class="actions">

            <button
                class="approve"
                onclick="approveSubmission('${submission.id}')"
            >
                ✓ Approve
            </button>

            <button
                class="reject"
                onclick="rejectSubmission('${submission.id}')"
            >
                ✕ Reject
            </button>

        </div>
        `
        :
        "";


    item.innerHTML =

        `
        <div class="submission-header">

            <div>

                <h3>
                    ${escapeHtml(
                        job?.title ||
                        "Job"
                    )}
                </h3>

                <p class="info">
                    Worker ID:
                    ${escapeHtml(
                        submission.worker_id
                    )}
                </p>

                <p class="info">
                    Submitted:
                    ${escapeHtml(date)}
                </p>

                <p class="info">
                    Reward:
                    $${reward.toFixed(2)}
                </p>

            </div>


            <span class="status ${statusClass}">
                ${escapeHtml(status)}
            </span>

        </div>


        <div class="proof">

            <strong>
                Text Answer
            </strong>

            ${escapeHtml(proofText)}

        </div>


        ${screenshot}


        ${actions}

        `;


    container.appendChild(
        item
    );

}


/* =========================================
   APPROVE SUBMISSION
========================================= */

window.approveSubmission =
async function(submissionId){

    const confirmed =
        confirm(
            "Approve this submission?"
        );


    if(!confirmed){
        return;
    }


    /*
     * Get submission.
     */

    const {
        data:submission,
        error:submissionError
    } =
    await supabase

        .from("job_submissions")

        .select(
            "id,job_id,worker_id,status"
        )

        .eq(
            "id",
            submissionId
        )

        .single();


    if(submissionError){

        alert(
            "Submission error:\n" +
            submissionError.message
        );

        return;
    }


    /*
     * Get job reward.
     */

    const {
        data:job,
        error:jobError
    } =
    await supabase

        .from("jobs")

        .select(
            "reward_per_worker,reward"
        )

        .eq(
            "id",
            submission.job_id
        )

        .single();


    if(jobError){

        alert(
            "Job error:\n" +
            jobError.message
        );

        return;
    }


    const reward =
        Number(
            job.reward_per_worker ??
            job.reward ??
            0
        );


    if(reward <= 0){

        alert(
            "Reward is 0 or missing."
        );

        return;
    }


    /*
     * Get worker wallet.
     */

    const {
        data:wallet,
        error:walletError
    } =
    await supabase

        .from("wallets")

        .select(
            "id,balance,pending_balance,total_earned"
        )

        .eq(
            "user_id",
            submission.worker_id
        )

        .single();


    if(walletError){

        alert(
            "Wallet error:\n" +
            walletError.message
        );

        return;
    }


    /*
     * Update wallet.
     */

    const newBalance =
        Number(
            wallet.balance || 0
        )
        +
        reward;


    const newTotalEarned =
        Number(
            wallet.total_earned || 0
        )
        +
        reward;


    const {
        error:updateWalletError
    } =
    await supabase

        .from("wallets")

        .update({

            balance:
                newBalance,

            total_earned:
                newTotalEarned

        })

        .eq(
            "id",
            wallet.id
        );


    if(updateWalletError){

        alert(
            "Wallet update failed:\n" +
            updateWalletError.message
        );

        return;
    }


    /*
     * Approve submission.
     */

    const {
        error:updateSubmissionError
    } =
    await supabase

        .from("job_submissions")

        .update({

            status:
                "approved"

        })

        .eq(
            "id",
            submissionId
        );


    if(updateSubmissionError){

        alert(
            "Approval failed:\n" +
            updateSubmissionError.message
        );

        return;
    }


    /*
     * Update completed jobs.
     */

    const {
        data:profile
    } =
    await supabase

        .from("profiles")

        .select(
            "completed_jobs"
        )

        .eq(
            "id",
            submission.worker_id
        )

        .single();


    if(profile){

        await supabase

            .from("profiles")

            .update({

                completed_jobs:
                    Number(
                        profile.completed_jobs || 0
                    ) + 1

            })

            .eq(
                "id",
                submission.worker_id
            );

    }


    alert(
        "Submission approved successfully!"
    );


    await loadSubmissions();

};


/* =========================================
   REJECT SUBMISSION
========================================= */

window.rejectSubmission =
async function(submissionId){

    const confirmed =
        confirm(
            "Reject this submission?"
        );


    if(!confirmed){
        return;
    }


    const {
        error
    } =
    await supabase

        .from("job_submissions")

        .update({

            status:
                "rejected"

        })

        .eq(
            "id",
            submissionId
        );


    if(error){

        alert(
            "Reject failed:\n" +
            error.message
        );

        return;
    }


    alert(
        "Submission rejected."
    );


    await loadSubmissions();

};


/* =========================================
   LOGOUT
========================================= */

document
    .getElementById("logoutBtn")
    .addEventListener(
        "click",
        async function(event){

            event.preventDefault();

            await supabase
                .auth
                .signOut();

            window.location.href =
                "login.html";

        }
    );


/* =========================================
   START
========================================= */

async function start(){

    const user =
        await checkAdmin();


    if(!user){
        return;
    }


    await loadSubmissions();

}


start();

</script>
