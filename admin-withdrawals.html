<script type="module">

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://rvwboegeisnrhwicvvhj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Kz3hgj9W0khG3JEIclhx2g_HZ6eSyQQ";

import {
    createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type
){

    const box =
    document.getElementById(
        "message"
    );

    box.textContent =
    text;

    box.className =
    "message " + type;

}


/* =====================================
   CHECK ADMIN
===================================== */

async function checkAdmin(){

    const {
        data:{
            user
        }
    } =
    await supabase
    .auth
    .getUser();


    if(!user){

        window.location.href =
        "login.html";

        return false;

    }


    const {
        data:profile,
        error
    } =
    await supabase

    .from("profiles")

    .select("role")

    .eq(
        "id",
        user.id
    )

    .single();


    if(
        error ||
        !profile ||
        profile.role !== "admin"
    ){

        alert(
            "Admin access required."
        );

        window.location.href =
        "worker-dashboard.html";

        return false;

    }


    return true;

}


/* =====================================
   LOAD WITHDRAWALS
===================================== */

async function loadWithdrawals(){

    const container =
    document.getElementById(
        "withdrawals"
    );


    container.innerHTML =
    "Loading withdrawals...";


    const {
        data,
        error
    } =
    await supabase

    .from("withdrawals")

    .select("*")

    .order(
        "created_at",
        {
            ascending:false
        }
    );


    if(error){

        container.innerHTML =
        "";

        showMessage(
            "Failed to load withdrawals: " +
            error.message,
            "error"
        );

        return;

    }


    let pending = 0;
    let approved = 0;
    let rejected = 0;


    data.forEach(
        withdrawal => {

            if(
                withdrawal.status ===
                "pending"
            )
                pending++;

            if(
                withdrawal.status ===
                "approved"
            )
                approved++;

            if(
                withdrawal.status ===
                "rejected"
            )
                rejected++;

        }
    );


    document.getElementById(
        "pendingCount"
    ).textContent =
    pending;


    document.getElementById(
        "approvedCount"
    ).textContent =
    approved;


    document.getElementById(
        "rejectedCount"
    ).textContent =
    rejected;


    if(!data.length){

        container.innerHTML =
        `
        <div class="empty">
            No withdrawal requests found.
        </div>
        `;

        return;

    }


    container.className =
    "";


    container.innerHTML =
    data.map(
        withdrawal => {

            const created =
            withdrawal.created_at
            ?
            new Date(
                withdrawal.created_at
            ).toLocaleString()
            :
            "-";


            let account =
            withdrawal.payment_account
            || "-";


            if(
                withdrawal.payment_method ===
                "International Bank Account"
            ){

                account =
                `
                ${withdrawal.account_holder_name || "-"}
                <br>
                ${withdrawal.bank_name || "-"}
                <br>
                ${withdrawal.account_number || "-"}
                <br>
                SWIFT: ${withdrawal.swift_code || "-"}
                <br>
                Country: ${withdrawal.bank_country || "-"}
                `;

            }


            const buttons =
            withdrawal.status ===
            "pending"
            ?
            `
            <div class="actions">

                <button
                    class="approve"
                    onclick="approveWithdrawal('${withdrawal.id}')"
                >
                    ✓ Approve
                </button>

                <button
                    class="reject"
                    onclick="rejectWithdrawal('${withdrawal.id}')"
                >
                    ✕ Reject
                </button>

            </div>
            `
            :
            "";


            return `

            <div class="withdrawal">

                <div class="withdrawal-top">

                    <div class="amount">
                        $${Number(
                            withdrawal.amount
                        ).toFixed(2)}
                    </div>

                    <div class="status ${withdrawal.status}">
                        ${withdrawal.status}
                    </div>

                </div>


                <div class="info-grid">

                    <div class="info">

                        <strong>
                            Worker ID
                        </strong>

                        ${withdrawal.user_id}

                    </div>


                    <div class="info">

                        <strong>
                            Payment Method
                        </strong>

                        ${withdrawal.payment_method}

                    </div>


                    <div class="info">

                        <strong>
                            Account
                        </strong>

                        ${account}

                    </div>


                    <div class="info">

                        <strong>
                            Date
                        </strong>

                        ${created}

                    </div>

                </div>


                ${buttons}

            </div>

            `;

        }
    ).join("");

}


/* =====================================
   APPROVE
===================================== */

window.approveWithdrawal =
async function(id){

    if(
        !confirm(
            "Approve this withdrawal?"
        )
    ){

        return;

    }


    const {
        data,
        error
    } =
    await supabase

    .rpc(
        "approve_withdrawal",
        {
            withdrawal_id:id
        }
    );


    if(error){

        showMessage(
            "Approve failed: " +
            error.message,
            "error"
        );

        return;

    }


    if(
        !data ||
        data.success !== true
    ){

        showMessage(
            data?.message ||
            "Approval failed.",
            "error"
        );

        return;

    }


    showMessage(
        "Withdrawal approved successfully!",
        "success"
    );


    await loadWithdrawals();

};


/* =====================================
   REJECT
===================================== */

window.rejectWithdrawal =
async function(id){

    if(
        !confirm(
            "Reject this withdrawal?"
        )
    ){

        return;

    }


    const {
        data,
        error
    } =
    await supabase

    .rpc(
        "reject_withdrawal",
        {
            withdrawal_id:id
        }
    );


    if(error){

        showMessage(
            "Reject failed: " +
            error.message,
            "error"
        );

        return;

    }


    if(
        !data ||
        data.success !== true
    ){

        showMessage(
            data?.message ||
            "Rejection failed.",
            "error"
        );

        return;

    }


    showMessage(
        "Withdrawal rejected successfully!",
        "success"
    );


    await loadWithdrawals();

};


/* =====================================
   LOGOUT
===================================== */

document
.getElementById(
    "logoutBtn"
)
.addEventListener(
    "click",
    async function(event){

        event.preventDefault();

        await supabase
        .auth
        .signOut();

        window.location.href =
        "login.html";

    }
);


/* =====================================
   START
===================================== */

const isAdmin =
await checkAdmin();


if(isAdmin){

    await loadWithdrawals();

}

</script>

</body>
</html>
